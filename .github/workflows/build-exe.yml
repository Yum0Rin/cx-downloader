name: build-exe

# 打 tag（v*）→ 构建 exe 并挂到 Release
# 推 main / 手动触发 → 只构建 + 上传 workflow artifact，不发 Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 跟本地构建用的版本保持一致；升版本记得本地也验一遍
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 打包 + 冻结自检
        shell: pwsh
        # CI 里用 -NoNetwork：自检的联网部分是去下载两个学习通公开预览文件，
        # 样例随时可能失效。CI 不该依赖外部服务，只验打包完整性
        # （core 符号齐全 / customtkinter 资源齐全 / GUI 可导入）就够了。
        run: ./build.ps1 -Python python -NoNetwork

      # 关键：别把中文文件名交给 gh.exe / upload-artifact。
      # 实测 PowerShell → gh.exe 的 argv 会把中文破坏掉，Release 附件名会变成
      # 莫名其妙的 default.exe。复制成 ASCII 名再往外发，顺带对下载者也友好。
      - name: 规范产物名
        shell: pwsh
        run: |
          $src = Get-ChildItem dist\*.exe | Select-Object -First 1
          $asset = "cx-downloader-$env:GITHUB_REF_NAME.exe"
          Copy-Item $src.FullName $asset -Force
          Write-Host "产物: $asset  ($([math]::Round((Get-Item $asset).Length/1MB,1)) MB)"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: chaoxing-downloader-exe
          path: cx-downloader-*.exe
          if-no-files-found: error

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $asset = "cx-downloader-$env:GITHUB_REF_NAME.exe"
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            # Release 已存在（比如重推同名 tag），覆盖附件
            gh release upload $env:GITHUB_REF_NAME $asset --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $asset `
              --title $env:GITHUB_REF_NAME `
              --generate-notes
          }
