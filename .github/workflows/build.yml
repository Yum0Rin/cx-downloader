name: build

# 打 tag（v*）→ 三个平台各构建一个单文件程序，挂到同一个 Release
# 推 main / 手动触发 → 只构建 + 上传 workflow artifact，不发 Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # 一个平台挂了别拖累另外两个
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # 跟本地构建用的版本保持一致；升版本记得本地也验一遍
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # PyInstaller 要把 Tk 的 .so 一起收进包，打包机上得先有 libtk / libtcl
      - name: Linux 装 Tk 运行库
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y tk

      - name: 打包 + 冻结自检（Windows）
        if: matrix.platform == 'windows'
        shell: pwsh
        # CI 里用 -NoNetwork：自检的联网部分是去下载两个学习通公开预览文件，
        # 样例随时可能失效。CI 不该依赖外部服务，只验打包完整性就够了。
        run: ./build.ps1 -Python python -NoNetwork

      - name: 打包 + 冻结自检（Linux / macOS）
        if: matrix.platform != 'windows'
        shell: bash
        run: ./build.sh --no-network

      # 关键：别把中文文件名交给 gh.exe / upload-artifact。
      # 实测 PowerShell → gh.exe 的 argv 会把中文破坏掉，Release 附件名会变成
      # 莫名其妙的 default.exe。统一复制成 ASCII 名再往外发。
      - name: 规范产物名（Windows）
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $asset = "out/cx-downloader-$env:GITHUB_REF_NAME-${{ matrix.platform }}.exe"
          Copy-Item "dist\超星文件下载器.exe" $asset -Force
          Write-Host "$asset  ($([math]::Round((Get-Item $asset).Length/1MB,1)) MB)"

      - name: 规范产物名（Linux / macOS）
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          mkdir -p out
          asset="out/cx-downloader-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          cp "dist/超星文件下载器" "$asset"
          chmod +x "$asset"
          ls -lh "$asset"

      - name: 上传构建产物
        uses: actions/upload-artifact@v6
        with:
          name: cx-downloader-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

      - name: 挂到 Release（Windows）
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = "out/cx-downloader-$tag-${{ matrix.platform }}.exe"
          # 三个平台并行跑，Release 可能已被别的 job 建好 —— 建失败不算错
          gh release create $tag --title $tag --generate-notes 2>$null
          gh release upload $tag $asset --clobber

      - name: 挂到 Release（Linux / macOS）
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform != 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="out/cx-downloader-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          # 三个平台并行跑，Release 可能已被别的 job 建好 —— 建失败不算错
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
